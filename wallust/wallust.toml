# wallust -- the single source of truth for this desktop's colour palette.
#
# WHY THIS EXISTS
# Before this, the cyberpunk palette was re-typed as a literal in every
# consumer: ~250 hardcoded colour values across waybar/style.css (175 alone),
# hypr/*.conf, rofi/config.rasi, alacritty.toml, qt6ct/colors/ and
# superfile/theme/. Changing one accent meant editing eight files by hand.
#
# Now: `wallust cs <name>` renders every template below from ONE colourscheme.
# Use ~/.config/wallust/theme-switch to switch palettes and reload everything.
#
# matugen (the more popular choice) was evaluated first and REJECTED: it
# harmonises `custom_colors` into a Material You scheme and cannot echo an
# exact palette. Measured on 4.1.0: #5de5ff -> #83d2e4, #161925 -> #b6c4ff,
# #d946ef -> #ecb5ec. `blend = false` had no effect and `custom_keywords` has
# no working reference syntax. wallust's `cs` subcommand takes the 16 colours
# verbatim, which is what curated named palettes need.
#
# THE 16-COLOUR MAPPING (wallust exposes only color0-15 + background/
# foreground/cursor -- there are no semantic names, so this table is the
# contract every template below relies on):
#
#   color0   base background      #161925
#   color1   magenta   accent / error / urgent
#   color2   cyan      PRIMARY accent
#   color3   light cyan  secondary text / warning
#   color4   deep cyan   inactive / selected background
#   color5   purple    tertiary accent
#   color6   cyan      (duplicate of color2)
#   color7   foreground           #c3c7d1
#   color8   lighter background   #222e39
#   color9-14  bright variants of 1-6
#   color15  white                #fefefe
#
# ADDING A PALETTE: drop a new file in colorschemes/ (pywal JSON format --
# "special" + "colors" objects, 16 colours plus background/foreground/cursor),
# then run `theme-switch`. Nothing else needs editing.
#
# Filters available (discovered empirically; the docs are thin):
#   | lower  | upper  | strip (drops the '#')  | rgb (-> "93,229,255")
#   | red | green | blue  | complementary
# NOT available: rgba, xrgba, hex, alpha, to_upper. Compose them in the
# template instead, e.g. rgba({{color2 | rgb}}, 0.24) or
# rgba({{color2 | strip | lower}}aa).

palette     = "dark16"
backend     = "fastresize"
color_space = "lch"

[templates]
# Compositor (Lua -- required by hypr/looknfeel.lua)
hypr      = { template = "hypr-colors.lua",      target = "~/.config/hypr/theme/colors.lua" }
# Lock screen (still hyprlang; sourced by hypr/hyprlock.conf)
hyprlock  = { template = "hyprlock-colors.conf", target = "~/.config/hypr/theme/colors.conf" }

# Status bar + launcher + notifications
waybar    = { template = "waybar-colors.css",    target = "~/.config/waybar/colors.css" }
rofi      = { template = "rofi-colors.rasi",     target = "~/.config/rofi/colors.rasi" }
swaync    = { template = "swaync-colors.css",    target = "~/.config/swaync/colors.css" }

# Terminal
alacritty = { template = "alacritty-colors.toml", target = "~/.config/alacritty/colors.toml" }

# GTK app theming. These override a subset of Sweet-Custom's 114
# @define-color names; the user gtk.css loads AFTER the theme, so widget
# shapes/assets stay Sweet-Custom and only colours follow the palette. This
# avoids rebuilding the vendored theme's SCSS entirely.
gtk3      = { template = "gtk-colors.css",       target = "~/.config/gtk-3.0/gtk.css" }
gtk4      = { template = "gtk-colors.css",       target = "~/.config/gtk-4.0/gtk.css" }

# Qt app theming (qt6ct.conf points color_scheme_path at this file).
# qt5ct gets the same content so the two can no longer drift.
qt6ct     = { template = "qt-colors.conf",       target = "~/.config/qt6ct/colors/wallust.conf" }
qt5ct     = { template = "qt-colors.conf",       target = "~/.config/qt5ct/colors/wallust.conf" }

# TUI file manager (superfile/config.toml selects theme = 'wallust')
superfile = { template = "superfile-theme.toml", target = "~/.config/superfile/theme/wallust.toml" }

# Login greeter (ReGreet). Rendered into the repo first because wallust runs as
# the user and /etc is root-owned; theme-switch installs it to
# /etc/greetd/regreet.css with `doas`, skipping silently if doas would prompt.
regreet   = { template = "regreet.css",          target = "~/.config/wallust/generated/regreet.css" }

# Shell prompt + CLI tools. starship re-reads its config on every render, so an
# open shell restyles on the next prompt with no restart.
starship  = { template = "starship.toml",        target = "~/.config/starship.toml" }
btop      = { template = "btop.theme",           target = "~/.config/btop/themes/wallust.theme" }
fastfetch = { template = "fastfetch.jsonc",      target = "~/.config/fastfetch/config.jsonc" }

# Power-menu icons. waybar/power-menu.sh previously fed freedesktop icon NAMES
# through rofi's dmenu icon protocol, resolved via the Papirus theme -- so
# system-shutdown.svg rendered as Material red (#f44336) with no relation to the
# palette. These are stroke-only SVGs coloured from the palette instead, passed
# to rofi by absolute path, so the icons re-theme with everything else.
icon_lock      = { template = "icons/lock.svg",      target = "~/.config/rofi/icons/lock.svg" }
icon_suspend   = { template = "icons/suspend.svg",   target = "~/.config/rofi/icons/suspend.svg" }
icon_logout    = { template = "icons/logout.svg",    target = "~/.config/rofi/icons/logout.svg" }
icon_hibernate = { template = "icons/hibernate.svg", target = "~/.config/rofi/icons/hibernate.svg" }
icon_reboot    = { template = "icons/reboot.svg",    target = "~/.config/rofi/icons/reboot.svg" }
icon_shutdown  = { template = "icons/shutdown.svg",  target = "~/.config/rofi/icons/shutdown.svg" }
icon_yes       = { template = "icons/yes.svg",       target = "~/.config/rofi/icons/yes.svg" }
icon_no        = { template = "icons/no.svg",        target = "~/.config/rofi/icons/no.svg" }

# The palette as shell variables, for scripts that need a colour at runtime.
# Consumed by wallust/build-icon-theme, and used with an isolated config dir to
# extract a built-in wallust theme's 16 colours when importing a new palette.
palette   = { template = "palette.sh",           target = "~/.config/wallust/generated/palette.sh" }
