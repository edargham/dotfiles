[general]
# Colours come from wallust -- see ~/.config/wallust/wallust.toml.
# colors.toml is GENERATED; edit the palette or the template, not it.
# The importing file is loaded LAST, so anything set below would override the
# import -- keep colour settings out of this file.
import = ["~/.config/alacritty/colors.toml"]

[window]
# Set opacity (0.0 = fully transparent, 1.0 = fully opaque)
opacity = 0.72

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
