[Settings]
gtk-theme-name=Sweet-cyberpunk
# KEEP THIS despite libadwaita logging "Using GtkSettings:gtk-application-
# prefer-dark-theme with libadwaita is unsupported". That warning means
# libadwaita apps ignore the key (they follow AdwStyleManager, fed by the
# portal's color-scheme=prefer-dark) -- not that the key is wrong. GTK4 does
# NOT derive this from the portal: verified via Gtk.Settings, removing the key
# flips it to False while the portal still reports prefer-dark. Plain,
# non-libadwaita GTK4 apps then render light. The two settings are
# complementary, so keep both in sync.
gtk-application-prefer-dark-theme=1
# Sweet-Wallust is GENERATED into ~/.local/share/icons on every theme switch by
# wallust/build-icon-theme -- a recoloured copy of the stock Sweet-Purple whose
# folder gradient follows the palette. The name is stable, so this line does not
# change when the palette does.
gtk-icon-theme-name=Sweet-Wallust
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
# NOTE: gtk-toolbar-style, gtk-toolbar-icon-size, gtk-button-images and
# gtk-menu-images are GTK3-only. GTK4 logs "Unknown key ..." for each on every
# app start; they were copied here from gtk-3.0/settings.ini. Do not re-add.
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-xft-rgba=rgb

