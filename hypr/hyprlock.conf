# Hyprlock configuration file
#
# Colours come from wallust -- see ~/.config/wallust/wallust.toml.
# theme/colors.conf is GENERATED; edit the palette or the template, not it.
#
# hyprlock is still hyprlang: only the COMPOSITOR moved to Lua in 0.55+, so
# this file keeps `source =` and $variables.
source = ~/.config/hypr/theme/colors.conf

general {
  hide_cursor = true

  # NOTE on options removed here (they errored on every launch in 0.9.6):
  #   disable_loading_bar - gone upstream, no replacement
  #   grace / no_fade_in  - now CLI flags (--grace N / --no-fade-in), not config
  #   fail_timeout        - MOVED from input-field{} to general{}
  # All three removed values were the defaults anyway (grace 0, fade-in on), so
  # behaviour is unchanged. Verify with:
  #   WAYLAND_DISPLAY=x hyprlock -v --display x 2>&1 | grep 'does not exist'
  fail_timeout = 2000
}

# The background (blur/effects) has an empty monitor field so it renders on ALL
# monitors, filling both screens. The info widgets below (profile image, input
# field, clock, username) are pinned to the primary monitor (DP-1) so they show
# on one screen only instead of mirroring across both.
background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
}

# Profile picture with cyberpunk gradient border
image {
  monitor = DP-1
  path = ~/Pictures/pps/Elias.jpg
  size = 150
  border_size = 5
  rounding = 100
  # Position the image higher up
  position = 0, 64
  halign = center
  valign = center
  # Set higher z-index to appear above password box
  zindex = 2

  # Gradient border effect
  border_color = $lockGradient

  # Shadow for added depth
  shadow_passes = 4
  shadow_size = 15
  shadow_color = $lockShadow
}

input-field {
  monitor = DP-1
  size = 200, 50
  outline_thickness = 3
  dots_size = 0.33
  dots_spacing = 0.15
  dots_center = false
  dots_rounding = -1
  # Matching gradient border
  outer_color = $lockGradient
  inner_color = $lockInner
  font_color = $lockFont
  fade_on_empty = true
  fade_timeout = 1000
  placeholder_text = <i>Input Password...</i>
  hide_input = false
  rounding = 8
  # Position the password box lower
  position = 0, -64
  halign = center
  valign = center
  # Set lower z-index to appear below image
  zindex = 1

  check_color = $lockCheck
  fail_color = $lockFail
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $lockCaps
  bothlock_color = $lockBoth
  invert_numlock = false
  swap_font_color = false
}

label {
  monitor = DP-1
  text = cmd[update:1000] echo "$TIME"
  color = $lockText
  font_size = 55
  font_family = JetBrainsMono Nerd Font
  position = -100, 70
  halign = right
  valign = bottom
  shadow_passes = 5
  shadow_size = 24
  shadow_color = $lockGlow
}

label {
  monitor = DP-1
  text = $USER
  color = $lockText
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = -100, 160
  halign = right
  valign = bottom
  shadow_passes = 5
  shadow_size = 24
  shadow_color = $lockGlow
}
