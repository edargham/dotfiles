general {
    # --grace 5 lets any input within 5s dismiss an idle-triggered lock, so
    # walking away briefly is not a blind password prompt. --immediate-render
    # draws without waiting on the screencopy that hyprlock's
    # `background { path = screenshot }` needs, which can stall after a resume.
    #
    # The DELIBERATE lock (SUPER+L -> prog.lock in programs.lua) keeps no grace
    # on purpose: an explicit lock should lock immediately.
    lock_cmd = pidof hyprlock || hyprlock --grace 5 --immediate-render

    before_sleep_cmd = loginctl lock-session      # lock before suspend.

    # Lua dispatcher form. `hyprctl dispatch dpms on` is a hyprlang leftover and
    # fails on EVERY call under Hyprland 0.56:
    #   error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
    # The outer single quotes are stripped by the `sh -c` hypridle runs the
    # command through, so Lua receives hl.dsp.dpms("on").
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'

    ignore_dbus_inhibit = false                   # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false                # whether to ignore systemd-inhibit --what=idle inhibitors
}



# Lock the screen. Was 300s, which fired often enough mid-read to feel like the
# machine had died -- combined with hyprlock's hide_cursor and DP-1-pinned input
# field, an idle lock is easily mistaken for a crash or a bad suspend.
listener {
    timeout = 900                                 # 15min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# Turn off the display. SAFETY: this is only recoverable from the console
# because misc:key_press_enables_dpms / mouse_move_enables_dpms are set true in
# looknfeel.lua. Do not blank the displays without them -- SSH is the only way
# back. See memory no-dpms-wake-fallback.
listener {
    timeout = 1200                                # 20min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'   # screen off when timeout has passed
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'    # screen on when activity is detected
}

